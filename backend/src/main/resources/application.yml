server:
  port: 8080
  shutdown: graceful
  forward-headers-strategy: native

shortener:
  base-url: ${SHORTENER_BASE_URL:http://localhost:8080}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shortener}
    username: ${DB_USERNAME:shortener}
    password: ${DB_PASSWORD:shortener}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  data:
    redis:
      repositories:
        enabled: false
      connect-timeout: 200ms
      timeout: 200ms

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
  health:
    redis:
      enabled: false
