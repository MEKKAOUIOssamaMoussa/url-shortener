server:
  port: 8080
  shutdown: graceful

shortener:
  base-url: ${SHORTENER_BASE_URL:http://localhost:8080}

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/shortener}
    username: ${DB_USERNAME:shortener}
    password: ${DB_PASSWORD:shortener}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
