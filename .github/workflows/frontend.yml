name: Frontend CI

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend.yml'

permissions:
  contents: read

jobs:
  build-and-test:
    name: Lint, Test, and Build Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js from .nvmrc
        uses: actions/setup-node@v7
        with:
          node-version-file: 'frontend/.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Run unit tests (headless)
        working-directory: frontend
        run: npm test -- --watch=false

      - name: Run production build
        working-directory: frontend
        run: npm run build

      - name: Upload production build
        uses: actions/upload-artifact@v7
        with:
          name: frontend-dist
          path: frontend/dist/frontend/browser
          if-no-files-found: error
          retention-days: 1

  deploy:
    name: Deploy to Azure Static Web Apps
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # GITHUB_TOKEN is never used: same-run artifact download does not need it and
    # repo_token (PR comments only) is omitted, so the job gets no permissions.
    permissions: {}
    concurrency:
      group: deploy-swa-shortener
      cancel-in-progress: false
    steps:
      - name: Download production build
        uses: actions/download-artifact@v8
        with:
          name: frontend-dist
          path: frontend-dist

      - name: Upload prebuilt app to Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: frontend-dist
          output_location: ''
          skip_app_build: true
